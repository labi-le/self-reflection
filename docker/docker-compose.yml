services:
  vision:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: tg2llm-vision
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp=unconfined
    ports:
      - "8080:8080"
    volumes:
      - ${MODELS_DIR:-/mnt/ssd2tb/llm/models}:/models
    command: >
      -m /models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
      --mmproj /models/mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf
      --host 0.0.0.0 --port 8080
      --device Vulkan0 -ngl 99
      -c 4096 -np 1 --flash-attn on
      --image-max-tokens 1024
    restart: unless-stopped

  # bge-m3 embedding server for the Telegram bot's long-term memory (semantic
  # recall over ChromaDB). CPU-only on purpose: leaves the single GPU entirely to
  # the persona model (persona-premium-web), and bge-m3 (560M) embeds a chat
  # message in well under a second on CPU. Joins the external `botnet` so the bot
  # reaches it by name at http://persona-embed:8092/v1/embeddings. This service is
  # independent of the media pipeline above — start it standalone:
  #   docker compose up -d embed
  # --pooling cls: bge-m3 dense retrieval pools the [CLS] token. -ub 8192 lets a
  # whole 8192-token input embed in one ubatch (llama.cpp requires n_ubatch >= the
  # input length for embeddings).
  embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: persona-embed
    ports:
      - "8092:8092"
    volumes:
      - ${MODELS_DIR:-/mnt/ssd2tb/llm/models}:/models
    command: >
      -m /models/bge-m3-FP16.gguf
      --host 0.0.0.0 --port 8092
      --embedding --pooling cls
      -c 8192 -b 8192 -ub 8192
      -t 4
    # The image's built-in HEALTHCHECK is hardcoded to port 8080; override it to
    # the port we actually serve on, else the container is wrongly "unhealthy".
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - botnet
    restart: unless-stopped

  tg2llm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tg2llm:latest
    container_name: tg2llm
    depends_on:
      - vision
    volumes:
      - ${EXPORT_DIR:-/home/labile/Downloads/ChatExport_2026-06-25}:/export
      - ${WHISPER_MODEL:-/home/labile/.cache/whisper-cpp/ggml-small.bin}:/models/whisper.bin:ro
    entrypoint: ["/usr/local/bin/parse"]
    command: >
      --decode-media
      --vision-host http://vision:8080
      --whisper-model /models/whisper.bin
      /export/result.json /export/parsed_dialogue.txt

  # LLaMA-Factory QLoRA fine-tuner (ROCm 7.2.3, RDNA4/gfx1201). Under the
  # `finetune` profile so it NEVER co-runs with `vision` — both want the whole
  # 16 GB VRAM (Risk #8). Start with: docker compose --profile finetune up -d
  # finetune, then `docker compose --profile finetune exec finetune bash`.
  finetune:
    build:
      context: ..
      dockerfile: finetune/docker/Dockerfile
    image: tg2llm-finetune:latest
    container_name: tg2llm-finetune
    profiles: [finetune]
    # Device/seccomp stanza mirrors the `vision` service (AMD GPU via ROCm).
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp=unconfined
    # Numeric host device-GIDs: render (303) owns /dev/kfd + renderD128, video
    # (26) owns card1. Group *names* fail here — the image has no `render` group
    # and its `video` gid (44) != the host's (26). Override per host if needed.
    group_add:
      - "${VIDEO_GID:-26}"
      - "${RENDER_GID:-303}"
    ipc: host
    # Defensive host-RAM cap (host has no swap), matching vision's documented
    # mem stanza; bounds dataloader + HF-cache host-RAM spikes during a run.
    mem_limit: 20g
    memswap_limit: 20g
    environment:
      # RDNA4 (gfx1201) GPU-Hang hardening. HSA_XNACK=0 + non-paged adamw_8bit
      # killed the deterministic step-150 hang; SDMA off + a HW-queue cap + a GC
      # threshold target the intermittent mid-run hang (a second hit at step 415).
      # expandable_segments curbs HIP allocator fragmentation.
      HSA_XNACK: "0"
      HSA_ENABLE_SDMA: "0"
      GPU_MAX_HW_QUEUES: "2"
      PYTORCH_HIP_ALLOC_CONF: "garbage_collection_threshold:0.8,expandable_segments:True"
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      # Reserve 6 of 64 CUs (58-63) for the desktop: HSA_CU_MASK restricts ROCm
      # compute queues only, NOT graphics (per ROCm docs), so those CUs stay free
      # for the compositor. Training runs full-clock on 58 CUs (~90%), no throttle.
      HSA_CU_MASK: "0:0-57"
      # Persist HF downloads (base model, tokenized cache) into the models dir.
      HF_HOME: /models/hf
    volumes:
      - ${MODELS_DIR:-/mnt/ssd2tb/llm/models}:/models
      - ${DATA_DIR:-../finetune}:/app/finetune
      - ${OUTPUT_DIR:-../finetune/output}:/app/saves
    # Idle so we can exec/run into it. Using `command` (not `entrypoint`) keeps
    # `docker compose run --rm finetune <cmd>` working (run overrides command).
    command: ["sleep", "infinity"]
    restart: "no"

# `botnet` is the user-defined bridge created for the persona stack
# (persona-premium-web + tg2llm-bot). Declared external so this compose joins the
# existing network instead of creating its own — the bot resolves `persona-embed`
# over it. Other services above have no `networks:` key, so they stay on this
# compose's auto-created default network (unchanged).
networks:
  botnet:
    external: true
