### LLaMA-Factory QLoRA SFT — Qwen2.5-7B-Instruct persona LoRA (PREMIUM: instruct-mix)
###
### Goal: keep the casual Денис persona voice BUT restore the reasoning / instruction-
### following that the original recipe destroyed (register-gating). Oracle-reviewed recipe.
### Changes vs the scrubbed recipe:
###   • dataset = persona_sharegpt_premium (~70% PII-scrubbed persona chats +
###     ~30% Russian instruct whose answers were restyled into casual Денис tone)
###   • lora_rank 64 → 32           (lighter adapter, less overwrite of base capability)
###   • cutoff_len stays 1024        (2048 → GPU memory-access fault on gfx1201 at step 0)
###   • learning_rate 1e-4 → 5e-5   (Oracle: gentler adaptation, protect un-replayed capability)
###   • grad_accum 8 → 16           (Oracle: smoother effective batch of 16)
###   • num_train_epochs 3 + frequent checkpoints → select the best epoch on an external
###     eval probe (17×23, apples, first-message retrieval, series rec); likely 1-2 epochs.
### Fresh start — no resume_from_checkpoint.
###
### Run (from repo root, with the LLaMA-Factory venv):
###   llamafactory-cli train finetune/configs/qlora_qwen25_7b_instruct_premium.yaml

### model — MUST be the *Instruct* checkpoint, never the Base model.
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true
# Force EAGER attention. Oracle-diagnosed: the experimental aotriton flash-attn path on
# gfx1201/RDNA4 (TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1) page-faults at step 0 on this
# dataset's sequence shapes; eager bypasses SDPA/aotriton entirely.
flash_attn: disabled

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 16
lora_dropout: 0.05
# lm_head and embed_tokens are DELIBERATELY EXCLUDED (Oracle-confirmed): tied Qwen2.5
# embedding/head under 4-bit QLoRA wastes VRAM and destabilises training.
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj

### quantization — QLoRA via bitsandbytes NF4 (4-bit base weights).
quantization_bit: 4
quantization_method: bnb

### dataset — premium blend (registered in data/dataset_info.json).
dataset_dir: /app/finetune
dataset: persona_sharegpt_scrubbed
template: qwen
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2

### output — separate dir; NO resume_from_checkpoint (fresh run on the premium blend).
### save_steps 500 keeps hang-resume granularity tight (hangs are rare on the hardened
### gfx1201); save_total_limit 8 retains the whole epoch trajectory for checkpoint-select.
output_dir: saves/_testB
logging_steps: 10
save_steps: 500
save_total_limit: 8
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
optim: adamw_8bit
num_train_epochs: 3
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
seed: 42
# AMD RDNA / ROCm: keep torch.compile OFF — the ROCm inductor backend is a known
# NaN-loss source on gfx11xx. Do not enable it.

### eval
val_size: 0.02
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
